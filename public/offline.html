<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ইন্টারনেট নেই</title>
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        background: #FBFAF6; color: #1B2430; padding: 24px;
        font-family: "Hind Siliguri", system-ui, sans-serif; text-align: center;
      }
      .card { max-width: 22rem; }
      h1 { font-size: 1.375rem; margin: 0 0 .5rem; }
      p { margin: 0 0 1.5rem; color: #4A5768; line-height: 1.6; }
      a {
        display: inline-flex; align-items: center; justify-content: center;
        min-height: 56px; padding: 0 28px; border-radius: 999px;
        background: #0A6E52; color: #fff; text-decoration: none; font-weight: 600;
      }
      .mark { width: 64px; height: 64px; margin: 0 auto 20px; border-radius: 18px;
              background: #0A6E52; display: grid; place-items: center;
              color: #FBFAF6; font-size: 30px; font-weight: 700; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark">৳</div>
      <h1>অ্যাপটি এখনো তৈরি হচ্ছে</h1>
      <p>
        একবার ইন্টারনেট দিয়ে অ্যাপটি খুললে এরপর থেকে ইন্টারনেট ছাড়াও চলবে।
        এখন একবার চেষ্টা করুন।
      </p>
      <a href="/">আবার চেষ্টা করুন</a>
    </div>
  </body>
</html>
